# Local staging: docker compose --profile staging up --build
# Development services only (also started by Spring Boot's Docker Compose support): docker compose up -d mysql mailpit
services:
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: veredito
      MYSQL_USER: veredito
      MYSQL_PASSWORD: ${DB_PASSWORD:-veredito-local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u veredito -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    profiles: [staging]
    image: ${VEREDITO_IMAGE:-veredito-app:local}
    build:
      context: .
      args:
        VEREDITO_VERSION: ${VEREDITO_VERSION:-0.4.0+dev}
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_URL: jdbc:mysql://mysql:3306/veredito
      DB_USER: veredito
      DB_PASSWORD: ${DB_PASSWORD:-veredito-local}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Staging only, not a secret; production reads veredito-code-key from Secret Manager.
      CODE_HASH_KEY: "staging only - not a secret - code hash key"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      # APP_PORT for machines where Windows reserves 8080 (see quickstart.md, Prerequisites).
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql-data:
