<header>
  <app-staging-banner [environment]="environment()" />
  <mat-toolbar class="toolbar">
    <a class="brand" routerLink="/" i18n="@@shell.title">Veredito</a>
    <span class="spacer"></span>
    @if (signedIn(); as current) {
      @if (current.name) {
        <span class="name">{{ current.name }}</span>
      }
      <button mat-button class="sign-out" type="button" (click)="signOut()" i18n="@@shell.signOut">Sign out</button>
    }
    <button
      mat-button
      class="language"
      type="button"
      [matMenuTriggerFor]="languageMenu"
      [attr.lang]="currentLocale"
      [attr.aria-label]="switchLabel"
    >
      <span class="long">{{ currentLabel }}</span>
      <span class="short">{{ currentLocale }}</span>
    </button>
    <mat-menu #languageMenu="matMenu">
      @for (option of locales; track option.code) {
        <button
          mat-menu-item
          [attr.lang]="option.code"
          [attr.aria-current]="option.code === currentLocale ? 'true' : null"
          (click)="switchTo(option.code)"
        >
          <span class="mark" aria-hidden="true">{{ option.code === currentLocale ? '✓' : '' }}</span>
          {{ option.label }}
        </button>
      }
    </mat-menu>
  </mat-toolbar>
</header>

<main class="page">
  @if (unavailable()) {
    <app-unavailable (retry)="load()" />
  } @else {
    <router-outlet />
  }
</main>

<footer class="footer">
  <span class="version" i18n="@@shell.version">Version {{ version }}</span>
</footer>
