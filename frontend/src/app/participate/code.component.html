@if (pending(); as entry) {
  <section class="code">
    <h1 class="page-title">
      <mat-icon class="page-title-icon" fontSet="material-symbols-outlined" aria-hidden="true">pin</mat-icon>
      <span i18n="@@code.title">Enter the code</span>
    </h1>
    <p class="page-intro email" i18n="@@code.sentTo">We sent a 6-digit code to {{ entry.email }}.</p>
    <p class="page-intro" i18n="@@code.validity">
      The code is valid for {{ entry.validityMinutes }} minutes. If it does not arrive, check the spam folder.
    </p>

    <div class="page-panel">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline">
        <mat-label i18n="@@code.label">Access code</mat-label>
        <input matInput formControlName="code" inputmode="numeric" autocomplete="one-time-code" maxlength="11" />
        <mat-error>{{ codeError }}</mat-error>
      </mat-form-field>


      <div class="actions">
        <button mat-flat-button type="submit" [disabled]="sending()">
          <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">login</mat-icon>
          <span i18n="@@code.signIn">Sign in</span>
        </button>
        <button mat-stroked-button type="button" (click)="resend()" [disabled]="sending() || secondsToResend() > 0">
          <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">refresh</mat-icon>
          @if (secondsToResend() > 0) {
            <span i18n="@@code.resendIn">Resend in {{ secondsToResend() }} s</span>
          } @else if (codeExpired()) {
            <span i18n="@@code.sendNew">Send a new code</span>
          } @else {
            <span i18n="@@code.resend">Resend code</span>
          }
        </button>
        <button mat-button type="button" (click)="correctEmail()">
          <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">edit</mat-icon>
          <span i18n="@@code.correctEmail">Correct e-mail</span>
        </button>
      </div>
    </form>
    </div>
  </section>
}
