# Production deployment of a commit already rehearsed in local staging:
#   git push origin <commit>:refs/tags/deploy/<version>
# Repository variables (non-secret identifiers, set by docs/cloud-setup.md):
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT, GCP_RUN_SERVICE_ACCOUNT, CLOUD_SQL_INSTANCE
name: deploy

on:
  push:
    tags: ["deploy/*"]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: southamerica-east1
  SERVICE: veredito
  IMAGE: southamerica-east1-docker.pkg.dev/veredito-issta2027/veredito/app

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: commit
        name: Resolve the tagged commit
        run: echo "sha=$(git rev-parse "${GITHUB_SHA}^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Refuse a commit whose ci run did not succeed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --status success --json databaseId --jq length)
          if [ "$runs" -eq 0 ]; then
            echo "::error::ci.yml has no successful run for $SHA; push it to Veredito and wait for ci first."
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: image
        name: Refuse a commit without its image
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          digest=$(gcloud artifacts docker images describe "${IMAGE}:${SHA}" --format='value(image_summary.digest)' 2>/dev/null || true)
          if [ -z "$digest" ]; then
            echo "::error::Image ${IMAGE}:${SHA} not found in Artifact Registry."
            exit 1
          fi
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
      # Public access (allUsers as invoker) is granted once in docs/cloud-setup.md: roles/run.developer
      # cannot change the IAM policy, so --allow-unauthenticated is not repeated here.
      - name: Deploy to Cloud Run
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          RUN_SERVICE_ACCOUNT: ${{ vars.GCP_RUN_SERVICE_ACCOUNT }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE_REF" \
            --region "$REGION" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --cpu 1 \
            --memory 1Gi \
            --min-instances 0 \
            --max-instances 4 \
            --cpu-boost \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod,DB_URL=jdbc:mysql:///veredito?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory,DB_USER=veredito_app,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_USER=diegoquirino@gmail.com" \
            --set-secrets "DB_PASSWORD=veredito-db-password:latest,SMTP_PASSWORD=veredito-smtp-password:latest,CODE_HASH_KEY=veredito-code-key:latest"
      - name: Send all traffic to the new revision (also after a rollback)
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest
      - name: Service URL and new revision
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.url,status.latestReadyRevisionName)' | tee -a "$GITHUB_STEP_SUMMARY"
